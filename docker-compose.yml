services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
    volumes:
      - appdata:/data
    expose:
      - "8000"          # only Caddy can reach the app; it is not published to the internet

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  appdata:
  caddy_data:
  caddy_config:
